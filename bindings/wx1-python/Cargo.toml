[package]
name = "wx1-python-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license.workspace = true
description = "Experimental PyO3 bindings for the WX-1 scientific storage core"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24.2" }
wx1-format = { path = "../../crates/wx1-format" }
wx1-registry = { path = "../../crates/wx1-registry" }

[features]
default = []
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
