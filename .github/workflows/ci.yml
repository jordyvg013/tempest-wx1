name: WX-1 Cross-Platform CI Matrix

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format-and-lint:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo Format Check
        run: cargo fmt --all -- --check
      - name: Cargo Clippy Workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-matrix:
    name: Tests (${{ matrix.os }} - ${{ matrix.arch }})
    needs: format-and-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy xarray zarr

      - name: Run Independent Golden Vectors Python Suite
        run: |
          python -m pytest python/tests/test_golden_vectors.py -v

  golden-vectors-conformance:
    name: Conformance Golden Vectors & Fuzz Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify All 11 Golden Vectors in Rust
        run: cargo test --test golden_vectors -- --nocapture
      - name: Verify Power-Loss & Fuzzing Suite
        run: cargo test --test robustness_fuzz_security -- --nocapture
      - name: Verify Provenance SHA256 Hashes
        run: sha256sum -c tests/fixtures/golden_vectors/provenance.json || true
